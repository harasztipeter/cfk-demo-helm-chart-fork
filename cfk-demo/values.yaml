images:
  kraftControllerApplication: docker.io/confluentinc/cp-server:7.9.1
  cpServer: confluentinc/cp-server:7.9.1
  registry: confluentinc/cp-schema-registry:7.9.1
  controlCenter: confluentinc/cp-enterprise-control-center:7.9.1
  init: confluentinc/confluent-init-container:2.11.1
  restProxy: confluentinc/cp-kafka-rest:7.9.1

kraft:
  replicas: 3
  dataVolumeCapacity: 250Mi

controlCenter:
  enabled: false
  replicas: 1

kafka:
  replicas: 3
  dataVolumeCapacity: 250Mi
  name: kafka-poc
  configOverrides:
    server:
      - "confluent.consumer.lag.emitter.interval.ms=60000"

schemaRegistry:
  replicas: 2
  name: schema-registry

restProxy:
  enabled: false

topics:
  # - name: example-topic-1
  #   replicas: 1
  #   partitions: 1
  #   configs:
  #     cleanupPolicy: compact

  # - name: example-topic-2
  #   replicas: 2
  #   partitions: 2
  #   configs:
  #     cleanupPolicy: delete

  # - name: example-topic-3
  #   replicas: 1
  #   partitions: 1
  #   configs:
  #     cleanupPolicy: delete

namespace: kafka-confluent-poc
