images:
  kraftControllerApplication: docker.io/confluentinc/cp-server:7.6.2
  cpServer: confluentinc/cp-server:7.6.2
  registry: confluentinc/cp-schema-registry:7.6.2
  controlCenter: confluentinc/cp-enterprise-control-center:7.5.0
  init: confluentinc/confluent-init-container:2.9.0
  restProxy: confluentinc/cp-kafka-rest:7.5.1

kraft:
  replicas: 3
  dataVolumeCapacity: 300Mi

controlCenter:
  enabled: false
  replicas: 1

kafka:
  replicas: 3
  dataVolumeCapacity: 290Mi
  name: kafka-poc

schemaRegistry:
  replicas: 2
  name: schema-registry

restProxy:
  enabled: false

topics:
  - name: example-topic-1
    replicas: 1
    partitions: 1
    configs:
      cleanupPolicy: compact

  - name: example-topic-2
    replicas: 2
    partitions: 2
    configs:
      cleanupPolicy: delete

  - name: example-topic-3
    replicas: 1
    partitions: 1
    configs:
      cleanupPolicy: delete

namespace: kafka-confluent-poc
